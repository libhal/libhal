name: 🏷️ Semantic Release
on:
  push:
    branches: [main]

# Versions are computed from the tags present when a run starts. Don't let two
# pushes compute the same version.
concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  # Releases v4/ and v5/ independently from (minor) and (patch) in commit
  # subjects. See https://github.com/libhal/ci#semantic_releaseyml
  release:
    uses: libhal/ci/.github/workflows/semantic_release.yml@5.x.y
    with:
      lines: '[{"major": 4, "dir": "v4"}, {"major": 5, "dir": "v5"}]'
    secrets:
      release_token: ${{ secrets.SEMANTIC_RELEASE }}
