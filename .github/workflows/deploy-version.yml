name: 🚀 Deploy

on:
  workflow_dispatch:
  release:
    types: [published]

# The tag's major version picks the directory: 4.x.y deploys v4/, 5.x.y
# (including pre-releases such as 5.0.0-alpha.1) deploys v5/.
jobs:
  deploy_v4:
    if: startsWith(github.ref, 'refs/tags/4.')
    uses: libhal/ci/.github/workflows/deploy.yml@5.x.y
    with:
      dir: "v4/"
      compiler: gcc
      version: ${{ github.ref_name }}
      arch: x86_64
      compiler_version: 12.3
      compiler_package: ""
      os: Linux
    secrets: inherit

  deploy_v5:
    if: startsWith(github.ref, 'refs/tags/5.')
    uses: libhal/ci/.github/workflows/package_and_upload_all.yml@5.x.y
    with:
      version: ${{ github.ref_name }}
      remote_url: https://libhal.jfrog.io/artifactory/api/conan/trunk-conan
      modules_support_needed: true
      coroutine_support_needed: true
      dir: v5
      llvm_profile: hal/tc/llvm-23
      conan_version: 2.33.0  # first release that knows clang 23
    secrets:
      conan_remote_password: ${{ secrets.JFROG_LIBHAL_TRUNK_ID_TOKEN }}
      conan_remote_user: ${{ secrets.JFROG_LIBHAL_TRUNK_ID_TOKEN_USER }}
